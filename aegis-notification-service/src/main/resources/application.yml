server:
  port: 8082

spring:
  application:
    name: aegis-notification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aegisnotify}
    username: ${DB_USERNAME:aegis}
    password: ${DB_PASSWORD:aegis}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  task:
    scheduling:
      pool:
        size: 2
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWKS_URI:http://localhost:8088/realms/aegis/protocol/openid-connect/certs}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

audit:
  publishing:
    enabled: true
  topic: notification-audit-events

notification:
  template:
    cache:
      maximum-size: ${NOTIFICATION_TEMPLATE_CACHE_MAX_SIZE:500}
      expire-after-write: ${NOTIFICATION_TEMPLATE_CACHE_TTL:PT1H}
  aggregation:
    enabled: ${NOTIFICATION_AGGREGATION_ENABLED:false}
    window: ${NOTIFICATION_AGGREGATION_WINDOW:PT5M}
    poll-interval: ${NOTIFICATION_AGGREGATION_POLL_INTERVAL:PT10S}
    require-same-template: ${NOTIFICATION_AGGREGATION_REQUIRE_SAME_TEMPLATE:true}
    max-group-size: ${NOTIFICATION_AGGREGATION_MAX_GROUP_SIZE:20}
    claim-lease: ${NOTIFICATION_AGGREGATION_CLAIM_LEASE:PT2M}
    max-attempts: ${NOTIFICATION_AGGREGATION_MAX_ATTEMPTS:3}
    excluded-templates: ${NOTIFICATION_AGGREGATION_EXCLUDED_TEMPLATES:}
    excluded-channels: ${NOTIFICATION_AGGREGATION_EXCLUDED_CHANNELS:}
    summarizer:
      base-url: ${AGGREGATION_LLM_BASE_URL:https://api.anthropic.com}
      api-key: ${AGGREGATION_LLM_API_KEY:}
      model: ${AGGREGATION_LLM_MODEL:claude-sonnet-4-5}
      anthropic-version: ${AGGREGATION_LLM_API_VERSION:2023-06-01}
      max-tokens: ${AGGREGATION_LLM_MAX_TOKENS:512}
      timeout: ${AGGREGATION_LLM_TIMEOUT:PT10S}
      max-output-chars: ${AGGREGATION_LLM_MAX_OUTPUT_CHARS:2000}
  kafka:
    relay:
      enabled: ${NOTIFICATION_KAFKA_RELAY_ENABLED:false}
      poll-interval: ${NOTIFICATION_KAFKA_RELAY_POLL_INTERVAL:PT5S}
    consumer:
      enabled: ${NOTIFICATION_KAFKA_CONSUMER_ENABLED:false}
      group-id: ${NOTIFICATION_KAFKA_CONSUMER_GROUP_ID:notification-service}
    topics:
      high-priority: ${NOTIFICATION_KAFKA_HIGH_PRIORITY_TOPIC:high-priority-topic}
      medium-priority: ${NOTIFICATION_KAFKA_MEDIUM_PRIORITY_TOPIC:medium-priority-topic}
      low-priority: ${NOTIFICATION_KAFKA_LOW_PRIORITY_TOPIC:low-priority-topic}
      partitions: ${NOTIFICATION_KAFKA_TOPIC_PARTITIONS:3}
      replication-factor: ${NOTIFICATION_KAFKA_TOPIC_REPLICATION_FACTOR:3}
      min-in-sync-replicas: ${NOTIFICATION_KAFKA_TOPIC_MIN_IN_SYNC_REPLICAS:2}
      dlt-suffix: ${NOTIFICATION_KAFKA_DLT_SUFFIX:-dlt}
  providers:
    email:
      base-url: ${SENDGRID_BASE_URL:https://api.sendgrid.com}
      api-key: ${SENDGRID_API_KEY:}
      from-address: ${SENDGRID_FROM_ADDRESS:noreply@aegisnotify.com}
      secondary:
        base-url: ${SENDGRID_SECONDARY_BASE_URL:https://api.sendgrid.com}
        api-key: ${SENDGRID_SECONDARY_API_KEY:}
        from-address: ${SENDGRID_SECONDARY_FROM_ADDRESS:noreply@aegisnotify.com}
    sms:
      base-url: ${TWILIO_BASE_URL:https://api.twilio.com}
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_SMS_FROM_NUMBER:}
      secondary:
        base-url: ${TWILIO_SECONDARY_BASE_URL:https://api.twilio.com}
        account-sid: ${TWILIO_SECONDARY_ACCOUNT_SID:}
        auth-token: ${TWILIO_SECONDARY_AUTH_TOKEN:}
        from-number: ${TWILIO_SECONDARY_SMS_FROM_NUMBER:}
    whatsapp:
      base-url: ${TWILIO_BASE_URL:https://api.twilio.com}
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_WHATSAPP_FROM_NUMBER:}
      secondary:
        base-url: ${TWILIO_SECONDARY_BASE_URL:https://api.twilio.com}
        account-sid: ${TWILIO_SECONDARY_ACCOUNT_SID:}
        auth-token: ${TWILIO_SECONDARY_AUTH_TOKEN:}
        from-number: ${TWILIO_SECONDARY_WHATSAPP_FROM_NUMBER:}
    push:
      base-url: ${FCM_BASE_URL:https://fcm.googleapis.com}
      project-id: ${FCM_PROJECT_ID:}
      access-token: ${FCM_ACCESS_TOKEN:}
      secondary:
        base-url: ${FCM_SECONDARY_BASE_URL:https://fcm.googleapis.com}
        project-id: ${FCM_SECONDARY_PROJECT_ID:}
        access-token: ${FCM_SECONDARY_ACCESS_TOKEN:}

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-rate-threshold: 40
        slow-call-duration-threshold: 2000ms
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
    instances:
      email-provider:
        base-config: default
      sms-provider:
        base-config: default
      whatsapp-provider:
        base-config: default
      push-provider:
        base-config: default
      aggregation-agent:
        base-config: default
        # Fix (review-resilience, WARNING): the shared `default` config's
        # 2000ms slow-call threshold was tuned for the fast SendGrid/Twilio/
        # FCM provider calls. SummarizerProperties' own default response
        # timeout is 10s (PT10S) — 5x longer — so reusing 2000ms would
        # routinely classify normal, healthy LLM latency as a "slow call",
        # risking the breaker tripping open under normal conditions.
        # 6000ms stays meaningfully below the 10s hard timeout while well
        # above typical healthy LLM response times.
        slow-call-duration-threshold: 6000ms

  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.aegisnotify.notification.infrastructure.provider.TransientProviderDeliveryException
    instances:
      email-provider:
        base-config: default
      sms-provider:
        base-config: default
      whatsapp-provider:
        base-config: default
      push-provider:
        base-config: default

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    circuitbreakers:
      enabled: true
