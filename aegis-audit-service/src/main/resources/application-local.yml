spring:
  config:
    activate:
      on-profile: local

audit:
  encryption:
    # Local-development fallback only; production must provide AUDIT_ENCRYPTION_KEY.
    key: ${AUDIT_ENCRYPTION_KEY:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# Honor X-Forwarded-Prefix from the gateway (/docs/<service>) so Swagger UI builds correct URLs.
server:
  forward-headers-strategy: framework
