server:
  port: 8083

spring:
  application:
    name: aegis-audit-service
  config:
    import: "optional:configserver:"
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/aegisnotify-audit}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWKS_URI:http://localhost:8088/realms/aegis/protocol/openid-connect/certs}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_SECURITY_USER}:${EUREKA_SECURITY_PASSWORD}@${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

audit:
  topic: notification-audit-events
  consumer:
    group-id: audit-service
  encryption:
    key: ${AUDIT_ENCRYPTION_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

# API docs are off by default; enabled only by the "local" profile (application-local.yml).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
