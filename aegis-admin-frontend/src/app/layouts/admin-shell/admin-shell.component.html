<!-- Main administrative shell wrapping the sidebar, topbar, and feature content -->
<div class="admin-layout">
  <app-sidebar />
  <div class="main-wrapper">
    <!-- Ambient backdrop: soft drifting color wash so glass surfaces have something to blur -->
    <div class="ambient" aria-hidden="true">
      <span class="ambient__blob ambient__blob--accent"></span>
      <span class="ambient__blob ambient__blob--cool"></span>
      <span class="ambient__blob ambient__blob--accent-soft"></span>
    </div>
    <app-topbar />
    <main class="content-area">
      <router-outlet />
    </main>
  </div>
</div>
