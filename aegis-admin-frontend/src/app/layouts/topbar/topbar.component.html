<!-- Main top navigation bar -->
<header class="topbar">
  <!-- Left section containing title and environment badge -->
  <div class="topbar-left">
    <!-- Hamburger menu toggle for mobile view -->
    <button
      type="button"
      class="menu-toggle"
      (click)="sidebarService.toggle()"
      aria-label="Toggle sidebar"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
    <h1 class="feature-title">{{ currentFeature() }}</h1>
    <!-- Badge indicating the current environment (e.g., Local Development) -->
    <div class="env-badge">
      <span class="env-dot"></span>
      <span class="env-label">{{ environmentName }}</span>
    </div>
  </div>

  <!-- Right section containing search, notifications, profile, and theme toggle -->
  <div class="topbar-right">
    <!-- Search input box -->
    <div class="search-box">
      <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" class="search-input" placeholder="Search notifications, providers..." />
    </div>

    <!-- Notifications area with bell icon and dropdown panel -->
    <div class="notifications-wrapper">
      <button
        type="button"
        class="bell-btn"
        (click)="toggleNotifications($event)"
        [class.active]="notificationsOpen()"
        title="Notifications"
        aria-label="Notifications"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
      </button>

      <!-- Dropdown panel shown when notifications are open -->
      @if (notificationsOpen()) {
        <div class="notifications-panel">
          <div class="notifications-header">
            <span class="panel-title">Notifications</span>
            <span class="panel-badge">0</span>
          </div>
          <!-- Empty state when there are no new notifications -->
          <div class="notifications-empty">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="empty-bell">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <p class="empty-title">No new notifications</p>
            <p class="empty-subtitle">You're all caught up</p>
          </div>
        </div>
      }
    </div>

    <div class="topbar-divider"></div>

    <!-- User profile section showing avatar and name -->
    <div class="user-profile">
      <div class="user-avatar">
        <span>AD</span>
      </div>
      <div class="user-info">
        <span class="user-name">{{ currentUser }}</span>
        <span class="user-role">{{ userRole }}</span>
      </div>
    </div>

    <div class="topbar-divider"></div>
    
    <!-- Button to toggle between light and dark themes -->
    <button class="theme-toggle" (click)="themeService.toggleTheme()" [title]="themeService.isDarkTheme() ? 'Switch to light theme' : 'Switch to dark theme'" aria-label="Toggle theme">
      @if (themeService.isDarkTheme()) {
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      }
    </button>
  </div>
</header>
