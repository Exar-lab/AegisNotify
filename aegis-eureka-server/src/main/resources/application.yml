server:
  port: 8761

spring:
  application:
    name: aegis-eureka-server
  security:
    user:
      name: ${EUREKA_SECURITY_USER}
      password: ${EUREKA_SECURITY_PASSWORD}

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
