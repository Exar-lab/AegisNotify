name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Skip fork PRs: GitHub never issues OIDC tokens (or shares secrets) to
    # workflows triggered by pull_request from a fork, no matter what
    # `permissions:` below says, so the job can never authenticate there —
    # it would just fail with "Could not fetch an OIDC token" every time.
    if: github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        # Pinned to v1.0.228 (2026-09-17, last known-good): floating @v1 picked
        # up v1.0.231 and claude-review started failing with the silent
        # is_error:true / num_turns:1 / cost:0 init crash on same-repo PRs
        # (blocks Release Please merges). See anthropics/claude-code-action#1720
        # and #1836. Bump deliberately once upstream ships a fix.
        uses: anthropics/claude-code-action@2261fcfc88e7de1b55f179edd588805e12de71f2 # v1.0.228
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # release-please opens its version-bump PRs as github-actions[bot];
          # without this, the action refuses any bot-authored PR outright.
          allowed_bots: 'github-actions[bot]'
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

